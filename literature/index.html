<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Literature · Mirko Tritella</title>
  <meta name="description" content="A research literature map: parliamentary NLP, information retrieval, RAG, political text analysis, evaluation, fairness.">
  <link rel="canonical" href="https://emeierkeio.github.io/literature/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="literature.css">
  <script>(function(){var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)})();</script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="site-name" href="/">Mirko Tritella</a>
    <nav class="site-nav" aria-label="Site">
      <a href="/#projects">Projects</a>
      <a href="/#research">Research</a>
      <a href="/literature/" aria-current="page">Literature</a>
      <a href="https://github.com/Emeierkeio">GitHub</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark theme">
        <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="lit-page">
  <div class="lit-wide">
    <h1 class="lit-title">Literature</h1>
    <p class="lit-intro">The research literature I work in: parliamentary NLP, information retrieval, RAG, political text analysis, evaluation, fairness.</p>
    <p class="lit-count" id="lit-count"></p>

    <div class="lit-instruments">
      <div class="lit-search-wrap">
        <input type="search" id="lit-search" class="lit-search"
               placeholder="Search papers, authors, methods, areas"
               autocomplete="off" role="combobox" aria-expanded="false"
               aria-controls="lit-search-results" aria-autocomplete="list"
               aria-label="Search papers, authors, methods, areas">
        <div id="lit-search-results" class="lit-search-results" role="listbox"
             aria-label="Search results" hidden></div>
      </div>
      <div class="lit-tools">
        <button type="button" id="lit-filters-toggle" class="lit-tool"
                aria-expanded="false" aria-controls="lit-filters">Filter</button>
        <button type="button" id="lit-gaps" class="lit-tool" aria-pressed="false">Gaps &amp; questions</button>
        <button type="button" id="lit-reset" class="lit-tool" aria-label="Reset view, path and filters">Reset</button>
      </div>
    </div>

    <div class="lit-filters" id="lit-filters" role="group" aria-label="Filters" hidden></div>
    <p class="lit-status" id="lit-status" role="status" aria-live="polite"></p>

    <div class="lit-layout" id="lit-layout">
      <div class="lit-stage" id="lit-stage">
        <nav class="lit-crumbs" id="lit-crumbs" aria-label="Map path" hidden></nav>
        <svg id="lit-svg" role="application"
             aria-label="Literature map. The overview shows sixteen research areas and their anchor papers; click an area or a node to explore, or use the search box."></svg>
        <div class="lit-zoomctl" role="group" aria-label="Zoom">
          <button type="button" id="lit-zoom-in" aria-label="Zoom in">+</button>
          <button type="button" id="lit-zoom-out" aria-label="Zoom out">&minus;</button>
          <button type="button" id="lit-zoom-fit" aria-label="Fit map to view">fit</button>
        </div>
        <div class="lit-hint" id="lit-hint">Click an area or node &middot; Esc goes back &middot; / searches</div>
        <div class="lit-tooltip" id="lit-tooltip" hidden></div>
        <button type="button" id="lit-panel-open" class="lit-panel-open" hidden>Details</button>
      </div>

      <aside class="lit-panel" id="lit-panel" tabindex="-1" aria-label="Research context panel">
        <div class="lit-panel-bar">
          <span class="lit-panel-kicker" aria-hidden="true">Research context</span>
          <button type="button" id="lit-panel-close" class="lit-panel-close" aria-label="Close the research context panel">&times;</button>
        </div>
        <div id="lit-panel-body" class="lit-panel-body"></div>
      </aside>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-links">
      <a href="/">Home</a>
    </div>
    <div class="footer-links">
      <a href="https://github.com/Emeierkeio">GitHub</a>
      <span>© 2026 Mirko Tritella</span>
    </div>
  </div>
</footer>

<script>
document.getElementById("theme-toggle").addEventListener("click", function () {
  var root = document.documentElement;
  var current = root.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var next = current === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
});
</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="literature.js" defer></script>

</body>
</html>
