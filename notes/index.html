<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes · Mirko Tritella</title>
  <meta name="description" content="Technical and research notes by Mirko Tritella.">
  <link rel="canonical" href="https://emeierkeio.github.io/notes/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <script>(function(){var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)})();</script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="site-name" href="/">Mirko Tritella</a>
    <nav class="site-nav" aria-label="Site">
      <a href="/#projects">Projects</a>
      <a href="/#research">Research</a>
      <a href="/#publications">Publications</a>
      <a href="https://github.com/Emeierkeio">GitHub</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark theme">
        <svg class="icon-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="page container">
  <h1>Notes</h1>
  <p>I collect technical and research notes here: experiments, things I learned, reading notes. Nothing published yet.</p>
  <p><a href="/">Back to the homepage</a></p>
</main>

<footer class="site-footer">
  <div class="container">
    <span>© 2026 Mirko Tritella</span>
  </div>
</footer>

<script>
document.getElementById("theme-toggle").addEventListener("click", function () {
  var root = document.documentElement;
  var current = root.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var next = current === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
});
</script>

</body>
</html>
